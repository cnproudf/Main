name: Daily Taylor Swift Digest

# Sent every morning to our Swiftie. GitHub Actions cron runs in UTC, so 11:34
# UTC is ~7:34 AM ET in summer (EDT) and ~6:34 AM ET in winter (EST). We use a
# SINGLE daily cron and the script sends whenever this run fires — GitHub's
# free scheduler is best-effort and often runs late, so we no longer gate on
# the exact hour (that's what silently skipped the send before). One cron a day
# = exactly one email a day, even if GitHub delivers it late.
on:
  schedule:
    - cron: "34 11 * * *"   # ~7:34 AM ET (EDT) / ~6:34 AM ET (EST)
  workflow_dispatch:         # lets you run it by hand from the Actions tab anytime

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compose and send the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: awwswiftie@chadnproudfoot.com
        run: python digest.py
